[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ============================================================
; 1. vpn-sub-updater — Dynamic subscription fetcher & validator (D5)
; ============================================================
[program:vpn-sub-updater]
command=/usr/bin/python3 /usr/local/lib/dev-infra/vpn-sub-updater.py --daemon
user=root
autostart=true
autorestart=true
priority=90
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/vpn-sub-updater.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/vpn-sub-updater.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ============================================================
; 2. sing-box — TUN / Proxy VPN daemon (single authoritative start)
; ============================================================
[program:sing-box]
directory=/var/lib/sing-box
command=/bin/bash -c 'for i in $(seq 1 30); do [ -s /var/lib/sing-box/config.active.json ] && break; sleep 1; done; CFG=/var/lib/sing-box/config.active.json; [ -s "$CFG" ] || CFG=/etc/sing-box/config.json; exec /usr/local/bin/sing-box run -c "$CFG"'
user=root
autostart=true
autorestart=true
startsecs=3
priority=100
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/sing-box.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/sing-box.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ============================================================
; 3. vpn-status — Internal read-only dashboard & JSON API (127.0.0.1:9099)
; ============================================================
[program:vpn-status]
command=/usr/bin/python3 /usr/local/lib/dev-infra/vpn-status-server.py
user=root
autostart=true
autorestart=true
priority=105
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/vpn-status.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/vpn-status.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ============================================================
; 4. vpn-watchdog — Monitors sing-tun & L7 reachability, emits alerts (D6)
; ============================================================
[program:vpn-watchdog]
command=/usr/local/lib/dev-infra/vpn-watchdog.sh
user=root
autostart=true
autorestart=true
priority=110
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/vpn-watchdog.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/vpn-watchdog.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ============================================================
; 5. Xvfb — Fallback virtual display :99 (skipped cleanly when WSLg :0 is live)
;    startsecs=0 prevents supervisorctl from flagging fast exit 0 as FATAL (ST-LIVE-3).
; ============================================================
[program:xvfb]
command=/bin/bash -c 'if [ "$(/usr/local/lib/dev-infra/display-detect.sh)" = ":0" ]; then echo "Live X11 :0 detected - Xvfb skipped"; exit 0; fi; exec /usr/bin/Xvfb :99 -screen 0 1920x1080x24 -ac'
user=root
autostart=true
autorestart=unexpected
startsecs=0
priority=150
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/xvfb.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/xvfb.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ============================================================
; 6. fluxbox — Lightweight WM on :99 fallback display only
; ============================================================
[program:fluxbox]
environment=HOME="/home/coder",DISPLAY=":99"
command=/bin/bash -c 'if [ "$(/usr/local/lib/dev-infra/display-detect.sh)" = ":0" ]; then echo "Live X11 :0 detected - fluxbox skipped"; exit 0; fi; for i in $(seq 1 15); do DISPLAY=:99 timeout 1 xdpyinfo >/dev/null 2>&1 && break; sleep 0.5; done; exec /usr/bin/fluxbox'
user=coder
autostart=true
autorestart=unexpected
startsecs=0
priority=200
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/fluxbox.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/fluxbox.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ============================================================
; 7. x11vnc — Password-protected VNC on :99 (skipped cleanly under WSLg :0 to avoid X_GetImage BadMatch, ST-LIVE-3)
; ============================================================
[program:x11vnc]
command=/bin/bash -c 'if [ "$(/usr/local/lib/dev-infra/display-detect.sh)" = ":0" ]; then echo "Live WSLg :0 detected - x11vnc skipped (native window active; use headless mode for noVNC)"; exit 0; fi; for i in $(seq 1 15); do DISPLAY=:99 timeout 1 xdpyinfo >/dev/null 2>&1 && break; sleep 0.5; done; exec /usr/bin/x11vnc -display :99 -rfbauth /run/vnc/passwd -listen localhost -xkb -forever -shared -rfbport 5900'
user=root
autostart=true
autorestart=unexpected
startsecs=0
priority=250
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/x11vnc.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/x11vnc.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ============================================================
; 8. noVNC — WebSocket bridge to local x11vnc (:99 headless/Linux/Hyper-V mode)
; ============================================================
[program:novnc]
command=/bin/bash -c 'if [ "$(/usr/local/lib/dev-infra/display-detect.sh)" = ":0" ]; then echo "Live WSLg :0 detected - noVNC skipped (use headless mode for noVNC)"; exit 0; fi; exec /usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5900'
user=root
autostart=true
autorestart=unexpected
startsecs=0
priority=300
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/novnc.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/novnc.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ============================================================
; 9. code-server — Browser IDE using file-staged password config (D8, D9)
; ============================================================
[program:code-server]
directory=/home/coder/workspace
environment=HOME="/home/coder"
command=/usr/bin/code-server --config /home/coder/.config/code-server/config.yaml /home/coder/workspace
user=coder
autostart=true
autorestart=true
priority=200
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/code-server.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/code-server.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ============================================================
; 10. omniroute — Supervised AI model router inside container (D3)
; ============================================================
[program:omniroute]
directory=/home/coder/workspace
environment=HOME="/home/coder"
command=/bin/bash -c '/usr/local/lib/dev-infra/wait-for-tun.sh || true; exec /usr/bin/env omniroute --port="${OMNIROUTE_PORT:-20128}"'
user=coder
autostart=true
autorestart=true
priority=220
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/omniroute.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/omniroute.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ============================================================
; 11. chromium — Opens local VPN Status Dashboard (127.0.0.1:9099) on :0 or :99
; ============================================================
[program:chromium]
environment=HOME="/home/coder"
command=/bin/bash -c '/usr/local/lib/dev-infra/wait-for-tun.sh || true; exec /usr/local/lib/dev-infra/start-chromium.sh'
user=coder
autostart=true
autorestart=false
priority=400
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/chromium.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/chromium.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3