[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid

; --- Control socket: required for `supervisorctl` to work ---
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ============================================================
; 1. sing-box
;    setup-vpn.sh installs the binary on first start (skipped
;    on restarts because the binary persists in the container).
;    CRLF is already stripped by the container CMD before
;    supervisord is invoked.
; ============================================================
[program:sing-box]
directory=/etc/sing-box
command=/bin/bash -c "command -v sing-box >/dev/null 2>&1 || /etc/sing-box/setup-vpn.sh; exec /usr/local/bin/sing-box run -c /etc/sing-box/config.json"
autostart=true
autorestart=true
priority=100
stdout_logfile=/var/log/supervisor/sing-box.out.log
stderr_logfile=/var/log/supervisor/sing-box.err.log

; ============================================================
; Display selection
;   /tmp/.X11-unix/X0 present  -> WSLg is mounted (compose bind).
;                                 Chromium draws straight onto the
;                                 Windows desktop as a normal window.
;   Socket absent (bare Linux) -> fall back to Xvfb :99.
; The guard exits 0 so `autorestart=unexpected` does not loop.
; ============================================================

; ============================================================
; 2. Xvfb — fallback virtual display on :99
; ============================================================
[program:xvfb]
command=/bin/sh -c "if [ -S /tmp/.X11-unix/X0 ]; then echo 'WSLg :0 present - Xvfb skipped'; exit 0; fi; exec /usr/bin/Xvfb :99 -screen 0 1920x1080x24 -ac"
autostart=true
autorestart=unexpected
priority=100
stdout_logfile=/var/log/supervisor/xvfb.out.log
stderr_logfile=/var/log/supervisor/xvfb.err.log

; ============================================================
; 3. fluxbox — window manager, fallback display only
;    WSLg runs its own Weston/RDP shell compositor.
; ============================================================
[program:fluxbox]
environment=DISPLAY=":99"
command=/bin/sh -c "if [ -S /tmp/.X11-unix/X0 ]; then echo 'WSLg :0 present - fluxbox skipped'; exit 0; fi; exec /usr/bin/fluxbox"
user=coder
autostart=true
autorestart=unexpected
priority=300
stdout_logfile=/var/log/supervisor/fluxbox.out.log
stderr_logfile=/var/log/supervisor/fluxbox.err.log

; ============================================================
; 4. x11vnc — VNC server on whichever display is live,
;    so noVNC shows the same desktop as the host window.
; ============================================================
[program:x11vnc]
command=/bin/sh -c 'D=:0; [ -S /tmp/.X11-unix/X0 ] || D=:99; exec /usr/bin/x11vnc -display $D -nopw -listen localhost -xkb -forever -shared -rfbport 5900'
autostart=true
autorestart=true
priority=300
stdout_logfile=/var/log/supervisor/x11vnc.out.log
stderr_logfile=/var/log/supervisor/x11vnc.err.log

; ============================================================
; 5. noVNC — websockify bridges browser WebSocket to VNC
;    Open http://localhost:6901/vnc.html in your host browser.
;    The /vnc.html suffix is required: the Debian novnc package
;    ships no index.html, so a bare / returns only a directory
;    listing. --web=/usr/share/novnc/ keeps relative asset paths
;    (core/, app/, vendor/) working from that URL.
; ============================================================
[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5900
autostart=true
autorestart=true
priority=400
stdout_logfile=/var/log/supervisor/novnc.out.log
stderr_logfile=/var/log/supervisor/novnc.err.log

; ============================================================
; 6. Chromium — native window on the Windows desktop via WSLg :0
;    No --proxy-server and no --host-resolver-rules:
;    sing-box is in TUN mode (auto_route), so all traffic
;    from Chromium is transparently routed through sing-box.
;    D-Bus is disabled because the container has no system bus.
;
;    DO NOT add --disable-software-rasterizer: under WSLg it
;    removes the only fallback and yields a blank window.
;    (The old --disable-gpu pair targeted an Xvfb CPU spin.)
;    If docker stats shows chromium pinning a core, add
;    --disable-gpu alone.
;
;    --user-data-dir gives each start a clean profile slot and
;    avoids stale SingletonLock silently blocking a restart.
;
;    autorestart=false: closing the window stays closed. To bring
;    it back:  docker exec ubuntu24-dev-box open-chromium
;              or  supervisorctl start chromium
;
;    Performance at 11 fps: Chromium's power saving normally
;    clamps background/most-visible throttling to 1 fps, which
;    over WSLg's software compositing feels like a slideshow.
;    These switches keep it at a steady 30 fps.
;
;    XDG_RUNTIME_DIR is deliberately blanked right before exec:
;    Chromium resolves --ozone-platform=x11 via OZONE_PLATFORM,
;    which only survives if WAYLAND_DISPLAY is not set in the
;    environment. Wayland detection runs on XDG_RUNTIME_DIR, so
;    keeping it set flips Chromium onto the Wayland path and the
;    window never appears (we mount only the X socket).
; ============================================================
[program:chromium]
environment=DISPLAY=":0",HOME="/home/coder",XDG_RUNTIME_DIR="/home/coder/.xdg"
command=/bin/sh -c 'mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR" && XDG_RUNTIME_DIR="" exec /usr/bin/chromium --no-sandbox --disable-dev-shm-usage --no-first-run --no-default-browser-check --password-store=basic --disable-features=dbus --ozone-platform=x11 --user-data-dir=/home/coder/.chromium-profile --window-position=0,0 --window-size=1280,800 --disable-background-timer-throttling --disable-backgrounding-occluded-windows --disable-renderer-backgrounding --disable-frame-rate-limit --disable-gpu-vsync https://ipinfo.io'
user=coder
autostart=true
autorestart=false
priority=400
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/chromium.out.log
stderr_logfile=/var/log/supervisor/chromium.err.log

; ============================================================
; 7. code-server — VS Code at http://localhost:8080
; ============================================================
[program:code-server]
directory=/home/coder/workspace
environment=HOME="/home/coder",PASSWORD="%(ENV_PASSWORD)s"
command=/usr/bin/code-server --bind-addr 0.0.0.0:8080 --auth password /home/coder/workspace
user=coder
autostart=true
autorestart=true
priority=200
stdout_logfile=/var/log/supervisor/code-server.out.log
stderr_logfile=/var/log/supervisor/code-server.err.log