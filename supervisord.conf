[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log

# 1. Keep sing-box running at all times
[program:sing-box]
directory=/etc/sing-box
# Executes your custom script if present, otherwise runs standard config.json
#command=/bin/bash -c "if [ -f /etc/sing-box/setup-vpn.sh ]; then chmod +x /etc/sing-box/start-singbox.sh && /etc/sing-box/start-singbox.sh; else /usr/bin/sing-box run -c /etc/sing-box/config.json; fi"
command=/usr/bin/sing-box run -c /etc/sing-box/config.json
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/sing-box.err.log
stdout_logfile=/var/log/supervisor/sing-box.out.log

# 2. Virtual Display (Xvfb) & Window Manager for Chromium
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24
autostart=true
autorestart=true

[program:fluxbox]
environment=DISPLAY=":99"
command=/usr/bin/fluxbox
user=coder
autostart=true
autorestart=true

# 3. VNC + Websockify (Streams Chromium to your browser at localhost:6901)
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -nopw -listen localhost -xkb -forever -shared
autostart=true
autorestart=true

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5900
autostart=true
autorestart=true

# 4. Launch Chromium explicitly routed through sing-box
[program:chromium]
environment=DISPLAY=":99",HOME="/home/coder"
# Replace 2080 below with the actual local port in your sing-box config
command=/usr/bin/chromium --no-sandbox --disable-dev-shm-usage --proxy-server="socks5://127.0.0.1:2080" --host-resolver-rules="MAP * ~NOTFOUND , EXCLUDE 127.0.0.1" https://ipinfo.io
user=coder
autostart=true
autorestart=true

# 5. Run VS Code Web Server (Accessible at localhost:8080)
[program:code-server]
directory=/home/coder/workspace
environment=HOME="/home/coder",PASSWORD="%(ENV_PASSWORD)s"
command=/usr/bin/code-server --bind-addr 0.0.0.0:8080 --auth password /home/coder/workspace
user=coder
autostart=true
autorestart=true
