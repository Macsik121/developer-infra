services:
  ubuntu-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubuntu24-dev-box
    hostname: dev-box

    stdin_open: true
    tty: true

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    shm_size: '2gb'

    ports:
      - "8080:8080"    # code-server
      - "6901:6080"    # noVNC (host 6901 -> container websockify 6080)

    volumes:
      - ./workspace:/home/coder/workspace
      - ./sing-box:/etc/sing-box
      - vscode-data:/home/coder/.local/share/code-server

    environment:
      - PASSWORD=devpassword123
      # sing-box runs in TUN mode (config.json has only a TUN inbound).
      # Do NOT set HTTP_PROXY/HTTPS_PROXY/ALL_PROXY here: those break
      # apt/curl until TUN is fully up, and Chromium does not need them
      # because TUN intercepts traffic at the kernel level.

volumes:
  vscode-data: