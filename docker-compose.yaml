services:
  ubuntu-dev:
    image: ${DEV_INFRA_IMAGE:-ghcr.io/macsik121/developer-infra}:${DEV_INFRA_PROFILE:-full}
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DEV_INFRA_PROFILE:-full}
    hostname: ${COMPOSE_PROJECT_NAME:-devbox-main}

    # Resource limits parameterized via .env (D2):
    # Workstation preset: 6 CPU / 10g RAM / 2g shm
    # Shared Server preset: 2 CPU / 4g RAM / 1g shm
    cpus: ${CPUS:-6}
    mem_limit: ${MEM_LIMIT:-10g}
    shm_size: ${SHM_SIZE:-2g}

    stdin_open: true
    tty: true
    stop_grace_period: 20s

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    security_opt:
      - no-new-privileges:true

    ulimits:
      nofile:
        soft: 16384
        hard: 65536

    labels:
      - "dev.infra.managed=true"
      - "dev.infra.project=${COMPOSE_PROJECT_NAME:-devbox-main}"
      - "dev.infra.profile=${DEV_INFRA_PROFILE:-full}"
      - "dev.infra.ports=${CODE_SERVER_PORT:-8080},${NOVNC_PORT:-6901},${OMNIROUTE_PORT:-20128}"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "${BIND_HOST:-127.0.0.1}:${CODE_SERVER_PORT:-8080}:8080"
      - "${BIND_HOST:-127.0.0.1}:${NOVNC_PORT:-6901}:6080"
      - "${BIND_HOST:-127.0.0.1}:${OMNIROUTE_PORT:-20128}:${OMNIROUTE_PORT:-20128}"

    volumes:
      - ${WORKSPACE_DIR:-./workspace}:/home/coder/workspace
      - ./sing-box:/etc/sing-box:ro
      - vscode-data:/home/coder/.local/share/code-server
      - chromium-profile:/home/coder/.chromium-profile
      - claude-state:/home/coder/.claude
      - omniroute-state:/home/coder/.config/omniroute
      - singbox-state:/var/lib/sing-box

    environment:
      - CODE_SERVER_PASSWORD=${CODE_SERVER_PASSWORD:?Set CODE_SERVER_PASSWORD in .env}
      - VNC_PASSWORD=${VNC_PASSWORD:?Set VNC_PASSWORD in .env}
      - VPN_SUBSCRIPTION_URL=${VPN_SUBSCRIPTION_URL:-}
      - VPN_UPDATE_INTERVAL=${VPN_UPDATE_INTERVAL:-3600}
      - VPN_RETRY_INTERVAL=${VPN_RETRY_INTERVAL:-600}
      - VPN_ALLOW_INSECURE=${VPN_ALLOW_INSECURE:-0}
      - VPN_MAX_NODES=${VPN_MAX_NODES:-30}
      - VPN_MTU=${VPN_MTU:-1280}
      - VPN_PROBE_NODES=${VPN_PROBE_NODES:-1}
      - VPN_PROTOCOL_ORDER=${VPN_PROTOCOL_ORDER:-vless,hysteria2}
      - VPN_NODE_FILTER=${VPN_NODE_FILTER:-}
      - VPN_NODE_EXCLUDE=${VPN_NODE_EXCLUDE:-}
      - VPN_FAIL_MODE=${VPN_FAIL_MODE:-strict}
      - VPN_AUTO_FAILOVER=${VPN_AUTO_FAILOVER:-1}
      - VPN_AGENT_POLICY=${VPN_AGENT_POLICY:-open}
      - VPN_ALLOW_PRESETS=${VPN_ALLOW_PRESETS:-ai,git,pkg}
      - VPN_ALLOW_DOMAINS=${VPN_ALLOW_DOMAINS:-}
      - VPN_GUI_NOTIFICATIONS=${VPN_GUI_NOTIFICATIONS:-1}
      - CHROMIUM_START_URL=${CHROMIUM_START_URL:-http://127.0.0.1:9099}
      - CHROMIUM_DISABLE_QUIC=${CHROMIUM_DISABLE_QUIC:-1}
      - CHROMIUM_DISABLE_GPU=${CHROMIUM_DISABLE_GPU:-0}
      - OMNIROUTE_PORT=${OMNIROUTE_PORT:-20128}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}

volumes:
  vscode-data:
  chromium-profile:
  claude-state:
  omniroute-state:
  singbox-state: